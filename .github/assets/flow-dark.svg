<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 464" width="800" height="464" role="img" aria-label="Data flow. On the sender: the camera frame is reduced and the face located on the device; every 2 seconds a 32-byte digest of the last 2 seconds is signed with Ed25519; the statement is error-coded and embedded as small shifts in a 32 by 18 grid of cells on three colour planes. Through the call: any call app and codec carry the pixels; the receiver reads a video tile, a captured window or a recording. On the receiver: pilots and soft LDPC decoding recover the statement, the verifier checks key, signature, revocation, session, freshness, replay and content, and a badge turns green only after two valid statements in a row.">
<style>
.s{font-family:'Inter','Segoe UI','Helvetica Neue',Helvetica,Arial,sans-serif}.m{font-family:ui-monospace,'SF Mono','Cascadia Mono','Segoe UI Mono',Menlo,Consolas,'Liberation Mono',monospace;letter-spacing:.14em;text-transform:uppercase}
.ink{fill:#EDEDED}.mute{fill:#8C8C8C}.acc{fill:#FFFFFF}
@keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes dash{to{stroke-dashoffset:-48}}
@keyframes fade{0%,100%{opacity:0}35%,65%{opacity:1}}
@keyframes sweep{0%{transform:translateX(0)}100%{transform:translateX(var(--d))}}
.pulse{animation:pulse 4s ease-in-out infinite}
.flow{stroke-dasharray:3 9;animation:dash 6s linear infinite}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
<rect width="800" height="464" rx="3" fill="#0A0A0A"/>
<defs><pattern id="g" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#171717" stroke-width="1"/></pattern></defs>
<rect width="800" height="464" rx="3" fill="url(#g)"/>
<path d="M24 14H14V24" fill="none" stroke="#8C8C8C" stroke-width="1"/><path d="M776 14H786V24" fill="none" stroke="#8C8C8C" stroke-width="1"/><path d="M24 450H14V440" fill="none" stroke="#8C8C8C" stroke-width="1"/><path d="M776 450H786V440" fill="none" stroke="#8C8C8C" stroke-width="1"/>
<text x="36" y="54" class="m" font-size="10.5"><tspan class="acc">A</tspan><tspan class="mute" dx="10">On the sender</tspan></text><line x1="172.6" y1="50" x2="764" y2="50" stroke="#171717"/><rect x="36" y="72" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:0.00s" cx="52" cy="93" r="3" fill="#FFFFFF"/>
<text x="64" y="97" class="m ink" font-size="11" font-weight="600">Camera frame</text>
<text x="52" y="119" class="s mute" font-size="12">320x180 luma reduction</text>
<text x="52" y="135" class="s mute" font-size="12">face box from on-device detector</text><path class="flow" d="M252 111H287" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M286 107l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="292" y="72" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:0.45s" cx="308" cy="93" r="3" fill="#FFFFFF"/>
<text x="320" y="97" class="m ink" font-size="11" font-weight="600">Digest + sign</text>
<text x="308" y="119" class="s mute" font-size="12">32-byte digest of the last 2 s</text>
<text x="308" y="135" class="s mute" font-size="12">Ed25519 statement, ~125 B</text><path class="flow" d="M508 111H543" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M542 107l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="548" y="72" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:0.90s" cx="564" cy="93" r="3" fill="#FFFFFF"/>
<text x="576" y="97" class="m ink" font-size="11" font-weight="600">Embed</text>
<text x="564" y="119" class="s mute" font-size="12">32x18 cells on Y, Cb and Cr</text>
<text x="564" y="135" class="s mute" font-size="12">LDPC about 1/5, CRC, pilots</text><path class="flow" d="M656 150V172H226V207" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M222 206l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="36" y="194" class="m" font-size="10.5"><tspan class="acc">B</tspan><tspan class="mute" dx="10">Through the call</tspan></text><line x1="197.2" y1="190" x2="764" y2="190" stroke="#171717"/><rect x="36" y="212" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:1.35s" cx="52" cy="233" r="3" fill="#FFFFFF"/>
<text x="64" y="237" class="m ink" font-size="11" font-weight="600">Any call app</text>
<text x="52" y="259" class="s mute" font-size="12">the seal travels in the pixels</text>
<text x="52" y="275" class="s mute" font-size="12">no server, no account</text><path class="flow" d="M252 251H287" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M286 247l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="292" y="212" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:1.80s" cx="308" cy="233" r="3" fill="#FFFFFF"/>
<text x="320" y="237" class="m ink" font-size="11" font-weight="600">Video codec</text>
<text x="308" y="259" class="s mute" font-size="12">VP8, VP9, H.264, AV1</text>
<text x="308" y="275" class="s mute" font-size="12">simulated and browser loop-back</text><path class="flow" d="M508 251H543" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M542 247l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="548" y="212" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:2.25s" cx="564" cy="233" r="3" fill="#FFFFFF"/>
<text x="576" y="237" class="m ink" font-size="11" font-weight="600">Received pixels</text>
<text x="564" y="259" class="s mute" font-size="12">video tile or window capture</text>
<text x="564" y="275" class="s mute" font-size="12">or a recorded file</text><path class="flow" d="M656 290V312H226V347" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M222 346l4 5l4 -5" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><text x="36" y="334" class="m" font-size="10.5"><tspan class="acc">C</tspan><tspan class="mute" dx="10">On the receiver</tspan></text><line x1="189" y1="330" x2="764" y2="330" stroke="#171717"/><rect x="36" y="352" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:2.70s" cx="52" cy="373" r="3" fill="#FFFFFF"/>
<text x="64" y="377" class="m ink" font-size="11" font-weight="600">Decode</text>
<text x="52" y="399" class="s mute" font-size="12">pilots, differential pairs</text>
<text x="52" y="415" class="s mute" font-size="12">soft LDPC, then CRC</text><path class="flow" d="M252 391H287" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M286 387l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="292" y="352" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:3.15s" cx="308" cy="373" r="3" fill="#FFFFFF"/>
<text x="320" y="377" class="m ink" font-size="11" font-weight="600">Check</text>
<text x="308" y="399" class="s mute" font-size="12">pinned key, signature, revoked</text>
<text x="308" y="415" class="s mute" font-size="12">session, fresh, replay, content</text><path class="flow" d="M508 391H543" fill="none" stroke="#FFFFFF" stroke-width="1.5"/><path d="M542 387l5 4l-5 4" fill="none" stroke="#FFFFFF" stroke-width="1.2"/><rect x="548" y="352" width="216" height="78" rx="2" fill="#111111" stroke="#2B2B2B"/>
<circle class="pulse" style="animation-delay:3.60s" cx="564" cy="373" r="3" fill="#FFFFFF"/>
<text x="576" y="377" class="m ink" font-size="11" font-weight="600">Badge</text>
<text x="564" y="399" class="s mute" font-size="12">green: 2 valid in a row</text>
<text x="564" y="415" class="s mute" font-size="12">amber unknown, red failed</text>
</svg>